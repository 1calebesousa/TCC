version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: autorevenda_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - autorevenda_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autorevenda_backend
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://admin:password@mongodb:27017/autorevenda?authSource=admin
      JWT_SECRET: sua_chave_secreta_super_segura
      PORT: 5000
      NODE_ENV: production
    depends_on:
      - mongodb
    networks:
      - autorevenda_network
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autorevenda_frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - autorevenda_network

volumes:
  mongodb_data:

networks:
  autorevenda_network:
    driver: bridge
